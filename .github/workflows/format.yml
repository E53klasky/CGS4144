name: Python Format Check

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  black:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Black
        run: pip install black

      - name: Check Python formatting
        run: black --check --diff .
